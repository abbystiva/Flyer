<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StivaCare Flyer Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f0;--card:#fff;--ink:#0e6868;--sub:#5d7a76;--accent:#eb6a52;--line:#e6dfd2;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10201f;--card:#183230;--ink:#7fd3cd;--sub:#9db8b4;--line:#2b4845;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10201f;--card:#183230;--ink:#7fd3cd;--sub:#9db8b4;--line:#2b4845;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
main{max-width:560px;margin:0 auto;padding:14px 16px 110px}
h1{font-size:19px;margin:2px 0 2px}
p.s{margin:0 0 10px;color:var(--sub);font-size:13px;font-weight:600}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;font-weight:700;margin:0 0 4px}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px inherit;margin-bottom:12px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:0;background:var(--accent);color:#fff;font:800 16px inherit;text-align:center;cursor:pointer;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:2px dashed var(--accent)}
.btn.off{opacity:.5}
.pk{position:relative;overflow:hidden}.pk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px}
#cv{width:100%;height:auto;aspect-ratio:1;display:block;border-radius:12px;background:#faf7f0}
.hint{font-size:12px;color:var(--sub);margin:8px 0 0;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:5}
.bar .btn{max-width:528px;margin:0 auto}
#ov{display:none;position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;z-index:10}
#ov .row{display:flex;gap:8px;max-width:560px;margin:0 auto}
#ov .row .btn{flex:1;padding:12px 6px;font-size:15px}
#ov img{display:block;width:100%;max-width:560px;margin:12px auto 0;border-radius:12px}
#ov p{max-width:560px;margin:10px auto 0;text-align:center}
</style>
</head>
<body>
<main>
<h1>StivaCare Flyer Maker</h1>
<p class="s">1. Type your name. 2. Add your photo. 3. Tap Download.</p>
<div class="box"><canvas id="cv" width="1080" height="1080"></canvas>
<p class="hint" id="hint">Your photo will blend into the flyer, so any background works.</p></div>
<div class="box">
<label for="nm">1. Your name</label>
<input type="text" id="nm" maxlength="26" placeholder="e.g. Abby" autocomplete="off">
<label>2. Your photo</label>
<div class="btn alt pk" id="pick"><span id="pt">Add your photo</span><input type="file" id="fi" accept="image/*"></div>
</div>
</main>
<div class="bar"><button class="btn off" id="dl" type="button">3. Download my flyer</button></div>
<div id="ov">
<div class="row"><a id="sv" class="btn" download="StivaCare-Flyer.png">Save image</a><button class="btn alt" id="sh" type="button" style="display:none">Share</button><button class="btn alt" id="cl" type="button">Close</button></div>
<p class="hint">Tap Save image. You can also press and hold the picture and choose Save.</p>
<img id="out" alt="Your StivaCare flyer">
</div>
